name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Vercel deploys automatically from GitHub via its built-in Git integration.
# This workflow only runs a type-check to catch TypeScript errors before
# Vercel builds — it does NOT deploy (that would duplicate Vercel's work).

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .
