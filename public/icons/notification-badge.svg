<!--
  Monochrome status-bar / notification-badge icon.
  Android (and Chrome's Web Push "badge") re-tints and masks this to a flat
  white silhouette in the status bar — only the alpha shape matters, never
  the fill color. Kept to one bare leaf silhouette with no internal detail:
  at true status-bar size (~24dp) fine detail just turns to mud, so the
  simplest recognizable outline reads best.

  Canvas is 96x96; the glyph is held within the center 48x48 (the 24dp
  "keyline" safe area doubled for a higher-density export) so it isn't
  clipped by the OS's own circular/square masking.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <path
    fill="#FFFFFF"
    d="M48,20 C68,30 68,56 48,76 C28,56 28,30 48,20 Z"
  />
</svg>
