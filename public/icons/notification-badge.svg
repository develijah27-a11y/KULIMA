<!--
  Monochrome status-bar / notification-badge icon — same design contract
  Android and Chrome's Web Push "badge" use for every app (WhatsApp
  included): the OS re-tints and masks this to a flat, single-color
  silhouette in the status bar, so only the alpha shape matters, never a
  fill color, gradient, or internal detail.

  Uses the "C" ring from the actual app icon (public/icons/icon.svg) —
  not an isolated leaf — since that ring is the brand's genuinely
  distinctive shape (literally the initial letter), simplified to a bare
  stroke with no sun/hills/leaf detail, which would just turn to mud at
  ~24dp anyway. Same single-bold-shape rule WhatsApp's own badge follows,
  applied to the more recognizable half of the mark.

  Canvas is 96x96; the glyph is held within the center 48x48 (24dp keyline
  safe area, doubled for a higher-density export) so it isn't clipped by
  the OS's own circular/square status-bar masking.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <path
    d="M73.3,69.2 A33,33 0 1 1 73.3,26.8"
    stroke="#FFFFFF"
    stroke-width="17"
    stroke-linecap="round"
    fill="none"
  />
</svg>
