<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Cropify mark, matched to the approved brand reference: a thick green
       "C" ring wrapping a rising sun over gentle field mounds, with a large
       leaf overlapping the ring's lower terminus. Palette: 0A5C36 / 34A853 /
       8BC34A / FFB300 (approved swatches). -->
  <rect width="256" height="256" rx="56" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="ringGrad" x1="195" y1="71" x2="195" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A5C36"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="198" y1="178" x2="238" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A5C36"/>
      <stop offset="1" stop-color="#8BC34A"/>
    </linearGradient>
  </defs>

  <!-- "C" ring -->
  <path d="M195.4,184.6 A88,88 0 1 1 195.4,71.4" stroke="url(#ringGrad)" stroke-width="46" stroke-linecap="round"/>

  <!-- Leaf overlapping the ring's lower terminus -->
  <path d="M198,178 Q198.8,217.5 238,222 Q237.2,182.5 198,178 Z" fill="url(#leafGrad)"/>
  <path d="M198,178 L238,222" stroke="#0A5C36" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Sunburst -->
  <g stroke="#FFB300" stroke-width="7" stroke-linecap="round">
    <path d="M132,112 L148,112"/>
    <path d="M125,129 L136.3,140.3"/>
    <path d="M108,136 L108,152"/>
    <path d="M91,129 L79.7,140.3"/>
    <path d="M84,112 L68,112"/>
    <path d="M91,95 L79.7,83.7"/>
    <path d="M108,88 L108,72"/>
    <path d="M125,95 L136.3,83.7"/>
  </g>
  <circle cx="108" cy="112" r="19" fill="#FFB300"/>

  <!-- Field mounds (drawn last so they form the horizon over the sun's lower rays) -->
  <path d="M50,178 Q92,148 130,166 Q152,153 176,166 L176,196 L50,196 Z" fill="#8BC34A"/>
</svg>
