<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Cropify mark, traced closely from the approved brand reference: a
       thick green "C" ring, a genuine 8-point sunburst (not simple rays)
       over layered field terracing, and a large two-tone leaf with a
       visible center vein overlapping the ring's lower terminus.
       Palette: 0A5C36 / 34A853 / 8BC34A / FFB300. -->
  <rect width="256" height="256" rx="56" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="ringGrad" x1="128" y1="40" x2="195" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A5C36"/>
      <stop offset="0.55" stop-color="#34A853"/>
      <stop offset="1" stop-color="#8BC34A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="192" y1="170" x2="242" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A5C36"/>
      <stop offset="1" stop-color="#8BC34A"/>
    </linearGradient>
  </defs>

  <!-- "C" ring -->
  <path d="M195.4,184.6 A88,88 0 1 1 195.4,71.4" stroke="url(#ringGrad)" stroke-width="46" stroke-linecap="round"/>

  <!-- Sunburst: orange disc + genuine 8-point star, not line rays -->
  <circle cx="115" cy="110" r="30" fill="#FFB300"/>
  <path d="M115,74 L120.7,96.1 L140.5,84.5 L128.9,104.3 L151,110 L128.9,115.7 L140.5,135.5 L120.7,123.9 L115,146 L109.3,123.9 L89.5,135.5 L101.1,115.7 L79,110 L101.1,104.3 L89.5,84.5 L109.3,96.1 Z" fill="#FFFFFF"/>

  <!-- Layered field terracing, drawn over the sun's lower edge for the horizon look -->
  <path d="M45,178 Q90,148 130,165 Q155,151 180,164 Q188,168 185,178 L185,202 L45,202 Z" fill="#34A853"/>
  <path d="M45,188 Q85,163 125,178 Q150,166 175,177 Q184,182 180,190 L180,206 L45,206 Z" fill="#8BC34A"/>

  <!-- Leaf overlapping the ring's lower terminus: two-tone with a visible center vein -->
  <path d="M193,172 Q195,214 242,226 Q239,182 193,172 Z" fill="url(#leafGrad)"/>
  <path d="M197,178 Q210,198 236,220" stroke="#F4FBF6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M206,190 L216,186" stroke="#F4FBF6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M216,202 L227,200" stroke="#F4FBF6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
