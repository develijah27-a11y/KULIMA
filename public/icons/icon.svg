<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Cropify mark, traced closely from the approved brand reference: a
       thick green "C" ring, a genuine 8-point sunburst (not simple rays)
       over three layered field-terrace bands, and a large leaf split into
       two flat-color halves along its center vein (not a smooth gradient)
       overlapping the ring's lower terminus.
       Palette: 0A5C36 / 34A853 / 8BC34A / FFB300. -->
  <rect width="256" height="256" rx="56" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="ringGrad" x1="128" y1="40" x2="195" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A5C36"/>
      <stop offset="0.55" stop-color="#34A853"/>
      <stop offset="1" stop-color="#8BC34A"/>
    </linearGradient>
  </defs>

  <!-- "C" ring -->
  <path d="M195.4,184.6 A88,88 0 1 1 195.4,71.4" stroke="url(#ringGrad)" stroke-width="46" stroke-linecap="round"/>

  <!-- Sunburst: orange disc + genuine 8-point star, not line rays -->
  <circle cx="115" cy="110" r="30" fill="#FFB300"/>
  <path d="M115,74 L120.7,96.1 L140.5,84.5 L128.9,104.3 L151,110 L128.9,115.7 L140.5,135.5 L120.7,123.9 L115,146 L109.3,123.9 L89.5,135.5 L101.1,115.7 L79,110 L101.1,104.3 L89.5,84.5 L109.3,96.1 Z" fill="#FFFFFF"/>

  <!-- Three layered field-terrace bands, drawn over the sun's lower edge for the horizon look -->
  <path d="M45,170 Q88,142 128,158 Q152,146 178,157 Q186,161 183,170 L183,202 L45,202 Z" fill="#0A5C36"/>
  <path d="M45,180 Q90,150 130,167 Q155,153 180,166 Q188,170 185,180 L185,204 L45,204 Z" fill="#34A853"/>
  <path d="M45,190 Q85,165 125,180 Q150,168 175,179 Q184,184 180,192 L180,208 L45,208 Z" fill="#8BC34A"/>

  <!-- Leaf overlapping the ring's lower terminus: two flat-color halves split by the center vein -->
  <path d="M193,172 Q195,214 242,226 Q217,198 193,172 Z" fill="#8BC34A"/>
  <path d="M193,172 Q217,198 242,226 Q239,182 193,172 Z" fill="#0A5C36"/>
  <path d="M193,172 Q217,198 242,226" stroke="#F4FBF6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M204,188 L214,183" stroke="#F4FBF6" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M215,201 L226,198" stroke="#F4FBF6" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
</svg>
